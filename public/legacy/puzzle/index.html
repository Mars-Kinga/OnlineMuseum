<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丝路文物拼图 - 首页</title>
    <style>
        :root {
            --gold: #d4af37;
            --paper: #f4f1ea;
        }
        .back-home {
            align-self: flex-start;
            margin-bottom: 12px;
            padding: 10px 16px;
            background: rgba(212, 175, 55, 0.2);
            color: var(--paper);
            border: 2px solid var(--gold);
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            transform: translateY(-2px);
            background: rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.25);
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "STSong", "SimSun", serif;
            color: var(--paper);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: #1f1a17;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./images/bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.12);
            pointer-events: none;
            z-index: -1;
        }

        .main-container {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            max-width: 95vw;
            max-height: 90vh;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: var(--gold);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
            font-size: 28px;
        }

        .nav-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 28px 32px;
            margin: 28px 0 10px;
            justify-items: center;
            align-items: start;
        }

        .nav-item {
            width: 100%;
            max-width: 320px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            transition: transform 0.25s ease;
            cursor: pointer;
            text-align: center;
            box-shadow: none;
        }
        .nav-item img {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 18px;
            border: none;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-item:hover {
            transform: translateY(-6px) scale(1.02);
            background: transparent;
            box-shadow: none;
        }

        .nav-item h3 {
            color: var(--gold);
            margin: 0;
            font-size: 28px;
            font-weight: 400;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
        }

        .nav-item p {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .nav-item a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--paper);
        }
        @media screen and (max-width: 900px) {
            .nav-container {
                grid-template-columns: repeat(2, minmax(180px, 1fr));
                gap: 24px;
            }

            .nav-item {
                max-width: 260px;
            }

            .nav-item img {
                width: 150px;
                height: 150px;
            }

            .nav-item h3 {
                font-size: 22px;
            }
        }

        @media screen and (max-width: 640px) {
            .nav-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <a class="back-home" href="/">← 返回博物馆首页</a>
        <h1>丝路文物拼图</h1>
        <p>选择下方的文物进行修复拼图</p>

        <div class="nav-container">
            <div class="nav-item">
                <a href="home.html?id=1">
                    <img src="./images/1.jpg" alt="巴尔巴尔石像">
                    <h3>巴尔巴尔石像</h3>
                </a>
            </div>
            <div class="nav-item">
                <a href="home.html?id=2">
                    <img src="./images/2.jpg" alt="乌兹别克斯坦木雕">
                    <h3>乌兹别克斯坦木雕</h3>
                </a>
            </div>
            <div class="nav-item">
                <a href="home.html?id=3">
                    <img src="./images/3.jpg" alt="塔吉克斯坦卧佛">
                    <h3>塔吉克斯坦卧佛</h3>
                </a>
            </div>
            <div class="nav-item">
                <a href="home.html?id=4">
                    <img src="./images/4.jpg" alt="吉尔吉斯斯坦毡毯">
                    <h3>吉尔吉斯斯坦毡毯</h3>
                </a>
            </div>
            <div class="nav-item">
                <a href="home.html?id=5">
                    <img src="./images/5.jpg" alt="土库曼斯坦古尔纹样">
                    <h3>土库曼斯坦古尔纹样</h3>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
